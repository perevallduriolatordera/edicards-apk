<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Pedido - Edicards</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .header h1 {
            color: #333333;
        }
        .content {
            padding: 20px 0;
            color: #555555;
            line-height: 1.6;
        }
        .content strong {
            color: #333333;
        }
        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #888888;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edicards</h1>
    </div>
    <div class="content">
        <p>Estimado/a <strong>{{NombreCliente}}</strong>,</p>
        <p>Gracias por la compra de productos <strong>Edicards</strong>.</p>
        <p>Su pedido nº <strong>{{idAlbaran}}</strong> está aceptado con la siguiente forma de pago: <strong>{{formaPago}}</strong>.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 Edicards. Todos los derechos reservados.</p>
        <p>Si tiene alguna pregunta, contacte con nosotros en <a href="mailto:soporte@edicards.com">soporte@edicards.com</a>.</p>
    </div>
</div>
</body>
</html>
